name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: make check
      - run: make test
      - run: make build

  # A tag like v1.2.3 builds the binaries and publishes them as a release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            GOARCH=$arch go build -trimpath -ldflags="-s -w" -o "dist/atlas-linux-$arch" ./cmd/atlas
          done
          cp udev/60-gamdias-atlas.rules dist/
          cd dist && sha256sum * > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            --notes "Linux binaries for x86-64 and arm64, and the udev rule. Install steps are in the [README](https://github.com/$GITHUB_REPOSITORY#install)." \
            dist/*
